server:
  port: 8081
spring:
  application:
    name: producto-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
