services:
  postgres-productos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productos
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-productos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d productos"]
      interval: 10s
      retries: 5

  producto-service:
    build: .
    image: ecommerce/producto-service:1.0
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-productos:5432/productos
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    depends_on:
      postgres-productos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      retries: 10
    restart: on-failure

volumes:
  pg-productos:
